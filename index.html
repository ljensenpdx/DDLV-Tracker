<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disney Dreamlight Valley - Daily Character Tracker</title>
  <style>
    :root {
      --bg-dark: #121324;
      --card-bg: #1c1e38;
      --card-inner: #26294d;
      --primary: #9d4edd;
      --primary-light: #c77dff;
      --accent-gold: #ffd166;
      --accent-green: #06d6a0;
      --text-main: #f8f9fa;
      --text-muted: #a0a3bd;
      --border-color: #3d4170;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-gold);
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Controls & Global Search */
    .toolbar {
      max-width: 1300px;
      margin: 0 auto 25px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    button.btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.btn:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: #e63946;
      color: white;
    }

    .btn-reset:hover {
      opacity: 0.9;
    }

    .btn-filter {
      background: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color) !important;
    }

    /* Characters Grid */
    .character-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .character-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .character-card:hover {
      border-color: var(--primary-light);
    }

    /* Header inside Card */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .char-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .char-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
      border: 2px solid var(--accent-gold);
    }

    .char-title h3 {
      font-size: 1.15rem;
      color: var(--accent-gold);
    }

    .char-title span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .role-select {
      background: var(--card-inner);
      color: var(--accent-green);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-weight: 600;
    }

    /* Daily Checkboxes */
    .daily-tasks {
      display: flex;
      gap: 15px;
      background: var(--card-inner);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .task-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .task-label input[type="checkbox"] {
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    /* Gifts Section */
    .gifts-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary-light);
      font-weight: 600;
    }

    .gift-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--card-inner);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .gift-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gift-checkbox {
      accent-color: var(--accent-gold);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .gift-input-bar input {
      flex: 1;
      background: #191b33;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* Source Guide Badge */
    .source-info {
      font-size: 0.82rem;
      background: rgba(157, 78, 221, 0.15);
      border-left: 3px solid var(--primary-light);
      padding: 6px 8px;
      border-radius: 0 6px 6px 0;
      color: #e0d5f5;
      line-height: 1.35;
      margin-top: 3px;
    }

    .source-title {
      font-weight: bold;
      color: var(--accent-gold);
      margin-right: 4px;
    }

    .highlight {
      background: #ffb703;
      color: #000;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>

      localStorage.setItem("ddv_tracker_data", JSON.stringify(data));
    }

    function renderCharacters(filterText = "") {
      const container = document.getElementById("charactersContainer");
      container.innerHTML = "";
      const state = getStoredData();
      const lowerFilter = filterText.toLowerCase();

      characterList.forEach(char => {
        const charState = state[char.id] || {
          role: "None",
          talk: false,
          scramble: false,
          gifts: ["", "", ""],
          giftDone: [false, false, false]
        };

        // Determine if character matches search
        let matches = char.name.toLowerCase().includes(lowerFilter) || 
                      char.universe.toLowerCase().includes(lowerFilter) ||
                      (charState.role && charState.role.toLowerCase().includes(lowerFilter));

        // Check if items or sources match the query
        charState.gifts.forEach(g => {
          if (!g) return;
          if (g.toLowerCase().includes(lowerFilter)) matches = true;
          const info = itemDatabase[g];
          if (info && (info.info.toLowerCase().includes(lowerFilter) || info.type.toLowerCase().includes(lowerFilter))) {
            matches = true;
          }
        });

        // Also check if user searched for any item in DB and matches character
        if (lowerFilter && !matches) {
          return; // Skip if filter doesn't match
        }

        // Render card
        const card = document.createElement("div");
        card.className = "character-card";
        card.dataset.charId = char.id;

        card.innerHTML = `
          <div class="card-header">
            <div class="char-info">
              <div class="char-avatar">${char.name.charAt(0)}</div>
              <div class="char-title">
                <h3>${highlightMatch(char.name, filterText)}</h3>
                <span>${char.universe}</span>
              </div>
            </div>
            <select class="role-select" onchange="updateRole('${char.id}', this.value)">
              ${roles.map(r => `<option value="${r}" ${charState.role === r ? "selected" : ""}>${r}</option>`).join("")}
            </select>
          </div>

          <div class="daily-tasks">
            <label class="task-label">
              <input type="checkbox" ${charState.talk ? "checked" : ""} onchange="updateCheck('${char.id}', 'talk', this.checked)">
              💬 Daily Discussion
            </label>
            <label class="task-label">
              <input type="checkbox" ${charState.scramble ? "checked" : ""} onchange="updateCheck('${char.id}', 'scramble', this.checked)">
              ♟️ Scramblecoin
            </label>
          </div>

          <div class="gifts-section">
            <div class="section-subtitle">Favorite Gifts of the Day</div>
            ${[0, 1, 2].map(i => {
              const giftVal = charState.gifts[i] || "";
              const isChecked = charState.giftDone[i] || false;
              const sourceData = findItemInfo(giftVal);

              return `
                <div class="gift-row">
                  <div class="gift-input-bar">
                    <input type="checkbox" class="gift-checkbox" ${isChecked ? "checked" : ""} onchange="updateGiftCheck('${char.id}', ${i}, this.checked)">
                    <input type="text" list="itemsDatalist" placeholder="Select or type gift #${i+1}..." value="${giftVal}" oninput="updateGiftItem('${char.id}', ${i}, this.value)">
                  </div>
                  ${sourceData ? `
                    <div class="source-info">
                      <span class="source-title">[${sourceData.type}]</span> ${highlightMatch(sourceData.info, filterText)}
                    </div>
                  ` : (giftVal.trim() ? `
                    <div class="source-info" style="border-left-color: #888;">
                      <span class="source-title">Custom Item:</span> Check Dreamlight Valley Wiki for exact spawn locations.
                    </div>
                  ` : '')}
                </div>
              `;
            }).join("")}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function findItemInfo(name) {
      if (!name) return null;
      // Direct match
      if (itemDatabase[name]) return itemDatabase[name];
      // Case insensitive match
      const key = Object.keys(itemDatabase).find(k => k.toLowerCase() === name.trim().toLowerCase());
      return key ? itemDatabase[key] : null;
    }

    function highlightMatch(text, query) {
      if (!query || !text) return text;
      const regex = new RegExp(`(${query})`, 'gi');
      return text.replace(regex, `<span class="highlight">$1</span>`);
    }

    // --- STATE UPDATE HANDLERS ---
    window.updateRole = function(charId, role) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = initCharState();
      state[charId].role = role;
      saveTrackerData(state);
    };

    window.updateCheck = function(charId, key, val) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = initCharState();
      state[charId][key] = val;
      saveTrackerData(state);
    };

    window.updateGiftCheck = function(charId, idx, val) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = initCharState();
      if (!state[charId].giftDone) state[charId].giftDone = [false, false, false];
      state[charId].giftDone[idx] = val;
      saveTrackerData(state);
    };

    window.updateGiftItem = function(charId, idx, val) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = initCharState();
      if (!state[charId].gifts) state[charId].gifts = ["", "", ""];
      state[charId].gifts[idx] = val;
      saveTrackerData(state);
      
      // Re-render only this card or view to update source preview
      const searchVal = document.getElementById("globalSearch").value;
      renderCharacters(searchVal);
    };

    window.resetDailyGifts = function() {
      if (!confirm("Are you sure you want to reset all daily talks, Scramblecoin, and favorite gift checks for today? (Character roles will stay saved)")) return;
      const state = getStoredData();
      Object.keys(state).forEach(id => {
        state[id].talk = false;
        state[id].scramble = false;
        state[id].gifts = ["", "", ""];
        state[id].giftDone = [false, false, false];
      });
      saveTrackerData(state);
      renderCharacters(document.getElementById("globalSearch").value);
    };

    function initCharState() {
      return {
        role: "None",
        talk: false,
        scramble: false,
        gifts: ["", "", ""],
        giftDone: [false, false, false]
      };
    }

    // Global Search listener
    document.getElementById("globalSearch").addEventListener("input", (e) => {
      renderCharacters(e.target.value);
    });

    // Initial render
    renderCharacters();
  </script>
</body>
</html>
