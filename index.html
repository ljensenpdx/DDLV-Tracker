<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disney Dreamlight Valley - Ultimate Daily Tracker & Item Compendium</title>
  <style>
    :root {
      --bg-dark: #0f101d;
      --card-bg: #1a1c33;
      --card-inner: #242747;
      --primary: #9d4edd;
      --primary-light: #c77dff;
      --accent-gold: #ffd166;
      --accent-green: #06d6a0;
      --accent-blue: #4cc9f0;
      --text-main: #f8f9fa;
      --text-muted: #a4a7c1;
      --border-color: #383c66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 2.2rem; color: var(--accent-gold); text-shadow: 0 0 14px rgba(255, 209, 102, 0.4); margin-bottom: 6px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    /* Sticky Search & Controls Header */
    .top-controls {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      top: 10px;
      z-index: 100;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .search-wrapper { flex: 1; min-width: 320px; position: relative; }
    .search-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrapper input:focus { border-color: var(--accent-gold); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-reset { background: #e63946; color: white; }

    /* Global Search Live Results Panel */
    .search-results-panel {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      padding: 14px;
      max-height: 280px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .search-results-panel.active { display: block; }
    .results-title { font-size: 0.85rem; color: var(--accent-gold); margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
    .search-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
    .search-item-card {
      background: var(--card-inner);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid var(--accent-blue);
      font-size: 0.85rem;
    }
    .search-item-card strong { color: #fff; display: block; margin-bottom: 2px; }
    .search-item-card span { color: var(--text-muted); font-size: 0.8rem; }

    /* Main Characters Grid */
    .character-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 18px;
    }

    .character-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease;
    }
    .character-card:hover { border-color: var(--primary-light); }
    .character-card.hidden { display: none; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .char-info { display: flex; align-items: center; gap: 12px; }
    .char-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      border: 2px solid var(--accent-gold);
    }
    .char-title h3 { font-size: 1.1rem; color: var(--accent-gold); }
    .char-title span { font-size: 0.78rem; color: var(--text-muted); }

    .role-select {
      background: var(--card-inner);
      color: var(--accent-green);
      border: 1px solid var(--border-color);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-weight: 600;
    }

    /* Tasks Checkboxes */
    .daily-tasks {
      display: flex;
      gap: 12px;
      background: var(--card-inner);
      padding: 7px 10px;
      border-radius: 8px;
    }
    .task-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.83rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .task-label input[type="checkbox"] { accent-color: var(--accent-green); width: 16px; height: 16px; cursor: pointer; }

    /* Gifts */
    .gifts-section { display: flex; flex-direction: column; gap: 8px; }
    .section-subtitle { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary-light); font-weight: bold; }
    
    .gift-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--card-inner);
      padding: 8px;
      border-radius: 8px;
    }
    .gift-input-bar { display: flex; align-items: center; gap: 8px; }
    .gift-checkbox { accent-color: var(--accent-gold); width: 18px; height: 18px; cursor: pointer; }
    .gift-input-bar input {
      flex: 1;
      background: #141629;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .source-info {
      font-size: 0.8rem;
      background: rgba(157, 78, 221, 0.18);
      border-left: 3px solid var(--primary-light);
      padding: 5px 8px;
      border-radius: 0 6px 6px 0;
      color: #ede2ff;
      line-height: 1.3;
      margin-top: 3px;
    }
    .source-tag { font-weight: bold; color: var(--accent-gold); margin-right: 4px; }
  </style>
</head>

    Object.keys(itemDatabase).sort().forEach(item => {
      const option = document.createElement("option");
      option.value = item;
      datalist.appendChild(option);
    });

    // Local Storage Helpers
    function getStoredData() {
      const saved = localStorage.getItem("ddv_tracker_master_db");
      return saved ? JSON.parse(saved) : {};
    }

    function saveStoredData(data) {
      localStorage.setItem("ddv_tracker_master_db", JSON.stringify(data));
    }

    function findItemInfo(name) {
      if (!name) return null;
      if (itemDatabase[name]) return itemDatabase[name];
      const matchKey = Object.keys(itemDatabase).find(k => k.toLowerCase() === name.trim().toLowerCase());
      return matchKey ? itemDatabase[matchKey] : null;
    }

    // Build the initial DOM of character cards once to prevent input flickering
    function initializeCards() {
      const container = document.getElementById("charactersContainer");
      container.innerHTML = "";
      const state = getStoredData();

      characterList.forEach(char => {
        const charState = state[char.id] || {
          role: "Unassigned",
          talk: false,
          scramble: false,
          gifts: ["", "", ""],
          giftDone: [false, false, false]
        };

        const card = document.createElement("div");
        card.className = "character-card";
        card.id = `card-${char.id}`;
        card.dataset.name = char.name.toLowerCase();
        card.dataset.universe = char.universe.toLowerCase();

        card.innerHTML = `
          <div class="card-header">
            <div class="char-info">
              <div class="char-avatar">${char.name.charAt(0)}</div>
              <div class="char-title">
                <h3>${char.name}</h3>
                <span>${char.universe}</span>
              </div>
            </div>
            <select class="role-select" onchange="handleRoleChange('${char.id}', this.value)">
              ${roles.map(r => `<option value="${r}" ${charState.role === r ? "selected" : ""}>${r}</option>`).join("")}
            </select>
          </div>

          <div class="daily-tasks">
            <label class="task-label">
              <input type="checkbox" id="talk-${char.id}" ${charState.talk ? "checked" : ""} onchange="handleTaskChange('${char.id}', 'talk', this.checked)">
              💬 Daily Talk
            </label>
            <label class="task-label">
              <input type="checkbox" id="scramble-${char.id}" ${charState.scramble ? "checked" : ""} onchange="handleTaskChange('${char.id}', 'scramble', this.checked)">
              ♟️ Scramblecoin
            </label>
          </div>

          <div class="gifts-section">
            <div class="section-subtitle">Favorite Gifts Today</div>
            ${[0, 1, 2].map(i => `
              <div class="gift-row">
                <div class="gift-input-bar">
                  <input type="checkbox" class="gift-checkbox" id="giftCheck-${char.id}-${i}" ${charState.giftDone[i] ? "checked" : ""} onchange="handleGiftCheck('${char.id}', ${i}, this.checked)">
                  <input type="text" list="itemsDatalist" id="giftInput-${char.id}-${i}" placeholder="Pick or type gift #${i+1}..." value="${escapeHtml(charState.gifts[i] || '')}" oninput="handleGiftInput('${char.id}', ${i}, this.value)">
                </div>
                <div class="source-info" id="sourceBox-${char.id}-${i}" style="${charState.gifts[i] ? '' : 'display:none;'}">
                  ${renderSourceBadge(charState.gifts[i])}
                </div>
              </div>
            `).join("")}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function renderSourceBadge(itemName) {
      if (!itemName) return "";
      const info = findItemInfo(itemName);
      if (info) {
        return `<span class="source-tag">[${info.type}]</span> ${info.info}`;
      }
      return `<span class="source-tag">[Custom Item]</span> Check Dreamlight Valley Wiki for drop biomes.`;
    }

    function escapeHtml(str) {
      return str.replace(/"/g, "&quot;");
    }

    // --- INTERACTIVE EVENT HANDLERS ---
    window.handleRoleChange = function(charId, role) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = defaultCharState();
      state[charId].role = role;
      saveStoredData(state);
    };

    window.handleTaskChange = function(charId, taskType, val) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = defaultCharState();
      state[charId][taskType] = val;
      saveStoredData(state);
    };

    window.handleGiftCheck = function(charId, idx, val) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = defaultCharState();
      state[charId].giftDone[idx] = val;
      saveStoredData(state);
    };

    window.handleGiftInput = function(charId, idx, val) {
      const state = getStoredData();
      if (!state[charId]) state[charId] = defaultCharState();
      state[charId].gifts[idx] = val;
      saveStoredData(state);

      // Update badge live without destroying DOM input focus
      const badge = document.getElementById(`sourceBox-${charId}-${idx}`);
      if (val.trim() === "") {
        badge.style.display = "none";
        badge.innerHTML = "";
      } else {
        badge.style.display = "block";
        badge.innerHTML = renderSourceBadge(val);
      }
    };

    window.resetDailyTasks = function() {
      if (!confirm("Reset all daily talks, Scramblecoin matches, and favorite gift slots for today? (Character roles will stay saved)")) return;
      const state = getStoredData();
      characterList.forEach(char => {
        if (!state[char.id]) state[char.id] = defaultCharState();
        state[char.id].talk = false;
        state[char.id].scramble = false;
        state[char.id].gifts = ["", "", ""];
        state[char.id].giftDone = [false, false, false];

        // Reset UI DOM inputs directly
        document.getElementById(`talk-${char.id}`).checked = false;
        document.getElementById(`scramble-${char.id}`).checked = false;
        for (let i = 0; i < 3; i++) {
          document.getElementById(`giftCheck-${char.id}-${i}`).checked = false;
          const input = document.getElementById(`giftInput-${char.id}-${i}`);
          input.value = "";
          const badge = document.getElementById(`sourceBox-${char.id}-${i}`);
          badge.style.display = "none";
          badge.innerHTML = "";
        }
      });
      saveStoredData(state);
    };

    function defaultCharState() {
      return {
        role: "Unassigned",
        talk: false,
        scramble: false,
        gifts: ["", "", ""],
        giftDone: [false, false, false]
      };
    }

    // --- GLOBAL LIVE SEARCH LOGIC ---
    const searchInput = document.getElementById("globalSearch");
    const resultsPanel = document.getElementById("searchResultsPanel");
    const searchGrid = document.getElementById("searchGrid");
    const resultsCount = document.getElementById("resultsCount");

    searchInput.addEventListener("input", function(e) {
      const query = e.target.value.trim().toLowerCase();

      if (!query) {
        resultsPanel.classList.remove("active");
        // Show all character cards
        characterList.forEach(c => {
          document.getElementById(`card-${c.id}`).classList.remove("hidden");
        });
        return;
      }

      // 1. Search Global Item Database
      const matchedItems = [];
      Object.keys(itemDatabase).forEach(itemName => {
        const item = itemDatabase[itemName];
        if (
          itemName.toLowerCase().includes(query) ||
          item.type.toLowerCase().includes(query) ||
          item.info.toLowerCase().includes(query)
        ) {
          matchedItems.push({ name: itemName, ...item });
        }
      });

      // Render Item Results
      if (matchedItems.length > 0) {
        resultsPanel.classList.add("active");
        resultsCount.innerText = `Found ${matchedItems.length} Master Encyclopedia Item Matches for "${query}":`;
        searchGrid.innerHTML = matchedItems.slice(0, 18).map(m => `
          <div class="search-item-card">
            <strong>${m.name} <span style="color:var(--accent-gold); font-size:0.75rem;">[${m.type}]</span></strong>
            <span>${m.info}</span>
          </div>
        `).join("");
      } else {
        resultsPanel.classList.add("active");
        resultsCount.innerText = `No items directly found matching "${query}". Checking characters below:`;
        searchGrid.innerHTML = `<div style="color:var(--text-muted); font-size:0.85rem;">No exact recipe or location match in encyclopedia.</div>`;
      }

      // 2. Filter Character Cards (by name, universe, current assigned gifts, or role)
      const state = getStoredData();
      characterList.forEach(char => {
        const cardElem = document.getElementById(`card-${char.id}`);
        const cState = state[char.id] || defaultCharState();

        let charMatch = char.name.toLowerCase().includes(query) ||
                        char.universe.toLowerCase().includes(query) ||
                        cState.role.toLowerCase().includes(query);

        // Check if any active daily gift in this card matches
        cState.gifts.forEach(g => {
          if (g && g.toLowerCase().includes(query)) charMatch = true;
        });

        if (charMatch) {
          cardElem.classList.remove("hidden");
        } else {
          cardElem.classList.add("hidden");
        }
      });
    });

    // Initial Load
    initializeCards();
  </script>
</body>
</html>
